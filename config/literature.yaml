# Reported juggling results from the reference papers, transcribed from the papers themselves
# (not estimated). Used only for the replication table (scripts/make_figures.py).

nakashima2008:
  cite: "A. Nakashima, Y. Sugiyama, Y. Hayakawa, 'Paddle Juggling by Robot Manipulator with Visual Servo', in Robot Manipulators, InTech 2008, doi:10.5772/6218 (journal version of ICARCV 2006)"
  robot: "DENSO 6-joint manipulator, joint J4 fixed (5 DOF used); torque-input via D/A (Sec. 2)"
  paddle: "aluminium square plate 150 mm, 3 mm thick, 0.20 kg (Sec. 2)"
  sensing: "2 CCD cameras + QuickMAG tracker, 120 Hz sampling (Sec. 2)"
  ball_model: "no air resistance; isotropic restitution matrix at impact (Sec. 3.3, Assumptions 1-2); restitution values not stated"
  control_law: "racket xy tracks the ball, z mirrors the ball about the hitting plane; racket tilt regulates the hitting point; energy-based gain for ball height (Sec. 5)"
  duration: "one continuous 100 s run (Sec. 6, Fig. 12); number of hits not reported"
  target: "hitting point [0.35, -0.65, 0.35] m (Sec. 6); apex target expressed through an energy threshold, 0.070 m (Sec. 6)"
  position_error: "mean hitting-position error 1.4 cm (x) and 3.6 cm (y); most of the ball path inside a 5 cm-radius circle (Sec. 6, Fig. 12)"
  height_error: "not reported numerically"
  robustness: "juggling preserved when the ball was disturbed at random with a stick (Sec. 6, Fig. 13)"

ji2024:
  cite: "Y. Ji, B. Zhang, Y. Mao, H. Wang, X. Hu, L. Zhang, 'Design, Modeling, and Experimental Validation of a Vision-Based Table Tennis Juggling Robot', Mathematics 12(11):1634, 2024, doi:10.3390/math12111634"
  robot: "3-DOF parallel mechanism with ball-joint end effector; servo motors 4 N·m rated / 12 N·m peak, gear ratio 7.75 (Sec. 6)"
  paddle: "hexagonal aluminium juggling paddle (Sec. 6)"
  sensing: "2 industrial cameras at 250 FPS, mounted 1 m above the robot (Secs. 1, 6)"
  ball_model: "V_z,out = k V_z,in + b with k = -0.95, b = 0 (Eq. 13)"
  control_law: "PD controller on the paddle tilt about X and Y driven by the ball's distance from the paddle centre, output limited; T-shaped velocity profile with stroke delta_z = 0.037 z_h (Sec. 5)"
  duration: "experiment 1: 100 juggles per height; experiment 2: 30 s per height (Sec. 6)"
  target: "bounce heights 10, 30, 50 cm above the paddle; target point = paddle centre (Sec. 6)"
  position_error: "maximum landing errors 250, 2500, 6000 mm^2 at 10, 30, 50 cm (Sec. 6, Fig. 7; units as reported); dispersion grows with height"
  height_error: "each juggle within 10% of the set height (Sec. 6, Figs. 9-10)"

# --- references the task sheet cites for the heuristic law [9]-[11] and the MPC extra credit [4] ---
nguyen2025:
  cite: "D. Nguyen, K. D. Cancio, S. Kim, 'High Speed Robotic Table Tennis Swinging Using Lightweight Hardware with Model Predictive Control', arXiv:2505.01617 (ICRA 2025)"
  robot: "custom lightweight 5-DOF arm (6th DOF optional), OptiTrack 120 Hz ball tracking (Sec. II-III)"
  method: "ball prediction with drag + table-rebound coefficients; joint-space OCP min sum(w_a qdd^2 + w_v qd^2) s.t. joint limits and terminal paddle position/velocity/orientation (eq. 3); CasADi + IPOPT; fixed-horizon MPC re-solved during the swing (Sec. IV)"
  solve_time: "warm-started FHMPC median ~2.8-3.2 ms, 99.5% convergence (Table I, Intel i9-14900K)"
  results: "hit rate 88.4% loop (topspin), 89.2% chop (backspin), 87.5% drive over 150 balls each; average exit velocity 11 m/s; paddle position error well within the 7.5 cm critical distance; speed within 2 m/s; orientation phi within 10 deg, theta up to 20 deg (Sec. V)"
  limitation_noted: "lacks wrist authority for some paddle angles; strike plane fixed (Sec. VI)"

buchler2022:
  cite: "D. Büchler, S. Guist, R. Calandra, V. Berenz, B. Schölkopf, J. Peters, 'Learning to Play Table Tennis From Scratch Using Muscular Robots', IEEE T-RO 38(6), 2022 (arXiv:2006.05935)"
  method: "model-free RL (step-based, stochastic policy) on a PAM-driven (pneumatic muscle) 4-DOF arm; hybrid sim-and-real training (HYSR) with simulated balls; reward = distance of landing point to the desired landing point"
  results: "on 107 real balls the agent hits 96% and returns 77%; also learns smashes (Sec. IV)"

ji2021:
  cite: "Y. Ji et al., 'Model-Based Trajectory Prediction and Hitting Velocity Control for a New Table Tennis Robot', IROS 2021, doi:10.1109/IROS51168.2021.9636000"
  method: "model-based ball trajectory prediction with clustering to reject invalid hitting points; quintic polynomial trajectory planning; position-based and velocity-based (hitting velocity control) return strategies"
  results: "prediction accuracy > 92%; return success > 95% for 3-7 m/s balls; velocity-based strategy better at 7-9 m/s (from the abstract; full text not accessed)"

gao2020:
  cite: "W. Gao et al., 'Robotic Table Tennis with Model-Free Reinforcement Learning', IROS 2020 (arXiv:2003.14398)"
  method: "simulated 8-DOF robot = 6-DOF arm + 2 linear axes; model-free policies (ES / PPO, CNN or MLP) from joint and ball position histories to joint velocities at 100 Hz; no ball model, no demonstrations; no spin"
  results: "best policy returns 80% of randomly thrown balls (99% hit rate) with bimodal forehand/backhand play; hierarchical variant 94% (Tables VII, Sec. V)"
