# All physical parameters and tunable gains/thresholds for the table tennis
# juggling simulation. Every entry carries its source:
#   [ITTF] ITTF regulation, [plan] CLAUDE.md design choice, [OpenArm] value in the
#   openarm-mujoco 2.3.0 MJCF, [std] standard physical constant,
#   [assumed] assumed — tunable.
# Units: SI (m, kg, s, rad, N, N·m) unless stated otherwise.

physics:
  timestep: 0.001                 # s  [plan §4] 1 kHz physics
  gravity: [0.0, 0.0, -9.81]      # m/s^2  [std]
  integrator: implicitfast        # [assumed] MuJoCo's recommended integrator; joint damping treated implicitly. Semi-implicit for the ball: see tt/aero.py half-step handling (Phase 2)

robot:
  # Where the OpenArm v2 `arm_origin` site (the bimanual model root) is placed in the world.
  # [assumed] shoulder height 1.20 m puts the home-pose paddle ~0.22 m above the table top;
  # y = 0.1535 m cancels the right arm's lateral offset so the paddle sits on the table's center line.
  base_pos: [0.0, 0.1535, 1.20]
  arm_prefix: openarm_right_      # [OpenArm] joint/body name prefix of the arm we keep; the left arm is removed
  removed_arm_body: openarm_left_base_link   # [OpenArm] root body of the arm we remove
  n_joints: 7                     # [OpenArm] joint1..joint7
  ee_body: openarm_right_ee_base_link   # [OpenArm] body moved by joint7; the paddle is welded to it
  # Bodies removed with the gripper (the paddle replaces it).           [OpenArm]
  gripper_bodies: [openarm_right_ee_inner_finger, openarm_right_ee_outer_finger]
  stand_half_width: 0.04          # m  [assumed] visual-only column from the floor to the shoulder

paddle:
  # Mount ("flange") point in the ee_base_link frame = where the stock gripper fingers attach.
  flange_pos: [-0.00143, 0.0, -0.068]   # m  [OpenArm] finger body pos in ee_base_link
  # Paddle frame orientation in the ee_base_link frame: handle along -z_ee (paddle +x),
  # blade normal along +x_ee (paddle +z) = rotation of +90 deg about y.
  # With this choice the blade faces straight up at the stock home pose (elbow 90 deg).
  flange_quat: [0.70710678, 0.0, 0.70710678, 0.0]   # [plan] (w, x, y, z)
  blade_radius: 0.075             # m  [plan §4] standard blade ~150 mm wide
  blade_thickness: 0.008          # m  [plan §4] blade + rubbers, 6–10 mm
  blade_mass: 0.10                # kg [assumed] blade + rubbers; thin-disk inertia from the cylinder geom
  handle_length: 0.05             # m  [assumed] exposed handle between gripper flange and blade edge
  handle_half_width: 0.012        # m  [assumed]
  handle_half_thickness: 0.004    # m  [assumed]
  handle_mass: 0.05               # kg [assumed]; total paddle 0.15 kg, within plan's 0.10–0.17 kg

ball:
  mass: 0.0027                    # kg [ITTF] 2.7 g
  radius: 0.020                   # m  [ITTF] 40 mm diameter
  # Thin hollow shell: I = 2/3 m r^2 (MuJoCo's default from the geom would be a solid sphere, 2/5 m r^2)  [std]
  hollow_shell: true
  init_offset_above_paddle: 0.6   # m  [plan Phase 5] drop height 0.5–0.8 m above the paddle

aero:
  # M2: F = -1/2 rho C_d A |v| v  +  1/2 rho C_m A r (w x v), gravity applied by MuJoCo; still air.
  # Applied each step through data.xfrc_applied (force at the ball's center of mass).
  air_density: 1.2                # kg/m^3 [std] sea level, ~20 °C
  drag_coefficient: 0.47          # [std] smooth sphere, subcritical Re (~1e4 here); inside the plan's 0.4–0.5 literature range — tunable
  magnus_coefficient: 0.0         # [plan] 0 = spin off for core juggling; set a literature value if spin is enabled
  # Spin decay (aerodynamic torque) is neglected: torque-free sphere -> world-frame spin is constant.  [assumed]

contact:
  # M3: analytic impulse model; MuJoCo contact between ball and paddle/table is disabled.
  paddle_restitution: 0.8         # [plan §4] assumed, tunable (sweep 0.7–0.9; depends on rubber)
  paddle_friction: 0.0            # Coulomb mu [plan §5] 0 = frictionless baseline
  table_friction: 0.0             # Coulomb mu [assumed] 0 = frictionless baseline (table matters only for the rally)
  # Table restitution is derived from the ITTF bounce rule, measured in air, so drag is
  # accounted for: e_t = sqrt((exp(2 k h_r) - 1) / (1 - exp(-2 k h_d))), k = drag coefficient k_d.
  # (Drag-free shortcut e_t = sqrt(23/30) = 0.876 would under-predict the rebound by ~1.5 cm.)
  table_rule_drop_height: 0.30    # m [ITTF 2.1.3] drop height
  table_rule_rebound_height: 0.23 # m [ITTF 2.1.3] "uniform bounce of about 23 cm"
  rewind_to_impact_time: true     # [plan §5 tunneling guard] apply the impulse at the estimated crossing time, not at the step where penetration is detected

table:
  length: 2.74                  # m  [ITTF]
  width: 1.525                    # m  [ITTF]
  top_height: 0.76                # m  [ITTF]
  thickness: 0.03                 # m  [assumed] visual
  leg_half_width: 0.03            # m  [assumed] visual
  near_edge_x: 0.65               # m  [assumed] robot behind its end line: the paddle at the hit centre (x = 0.475 ± 0.075) stays outside the table
  net_height: 0.1525              # m  [ITTF]
  net_overhang: 0.1525            # m  [ITTF] net extends 15.25 cm beyond each side line

hit:
  # Centre of the hit plane (paddle centre at impact for a ball on target), z = hit-plane height z_h.
  center: [0.475, 0.0, 1.00]      # m  [measured in sim] scripts/workspace_scan.py: max manipulability among points reachable with ±20° tilts and >= 0.10 rad joint margin

ready_pose:
  # The ready pose is solved by IK (tt/kinematics.py) from these targets, not hard-coded.
  offset_from_hit_center: [0.0, 0.0, -0.08]   # m [assumed] paddle waits 8 cm below the hit plane, so strokes accelerate upward into the ball
  paddle_normal: [0.0, 0.0, 1.0]  # [plan] paddle horizontal, facing up
  q_nominal: [0.0, 0.5, 0.0, 1.5708, 0.0, 0.0, 0.0]   # rad [assumed] posture prior: elbow 90°, shoulder abducted 0.5 rad (joint2 limit is -0.17 rad; 0.5 gave the most joint margin in the Phase 4 scan)
  ik_weight_pos: 1.0              # [assumed] residual weight on paddle position (m)
  ik_weight_normal: 1.0           # [assumed] residual weight on paddle normal (unit vector)
  ik_weight_posture: 0.01         # [assumed] residual weight pulling q toward q_nominal (rad)
  ik_tol: 1.0e-12                 # [assumed] least-squares tolerance (ftol/xtol/gtol)
  ik_refine_posture_ratio: 1.0e-4 # [assumed] stage-2 posture weight = ik_weight_posture * this (task met exactly)

workspace_scan:
  # Phase 4 search for the hit-plane centre (scripts/workspace_scan.py).
  x_range: [0.20, 0.60]           # m  [assumed] in front of the shoulder
  z_range: [0.80, 1.35]           # m  [assumed] around shoulder height (1.20 m)
  step: 0.025                     # m  [assumed]
  y: 0.0                          # m  [assumed] table centre line
  max_tilt_deg: 20.0              # deg [plan §6] paddle tilt the juggling law may command
  min_joint_margin: 0.10          # rad [assumed] every joint >= 5.7° from its limits for all tilts and the ready pose (0.15 rad left no feasible point: wrist pitch joint6 is only ±45°)
  ball_column_clearance: 0.12     # m  [assumed] arm link origins above the hit plane must be this far (horizontally) from the ball's vertical path
  ik_tol_pos: 0.001               # m  [assumed] IK counted as reached within 1 mm ...
  ik_tol_normal_deg: 0.5          # deg [assumed] ... and 0.5 deg

planner:
  pinv_damping: 1.0e-3            # [assumed] damped pseudo-inverse for q_dot at impact (negligible away from singularities)
  approach_time: 0.30             # s  [assumed] stroke start -> impact (tracking test)
  return_time: 0.50               # s  [assumed] impact -> back at rest in the ready pose (follow-through + return)

control:
  # Phase 1 hold controller: tau = qfrc_bias(q, qdot) + Kp (q_d - q) - Kd qdot
  hold_kp: [100.0, 100.0, 60.0, 60.0, 20.0, 20.0, 20.0]   # N·m/rad [assumed]
  hold_kd: [5.0, 5.0, 3.0, 3.0, 1.0, 1.0, 1.0]            # N·m·s/rad [assumed]
  # Computed torque: closed-loop e_dd + Kd e_d + Kp e = 0 per joint (units 1/s^2, 1/s).
  ct_kp: 900.0                    # [assumed] omega_n = 30 rad/s ...
  ct_kd: 60.0                     # [assumed] ... critically damped (Kd = 2 omega_n); omega_n dt = 0.03 << 1 at 1 kHz
  friction_ff: true               # [assumed] feed the model's dry joint friction (frictionloss) forward
  friction_smoothing: 0.01        # rad/s [assumed] tanh smoothing of sign(qd_d)

tracking:
  settle_time: 0.2                # s  [assumed] hold the ready pose before the stroke starts
  # Strokes for scripts/tracking_test.py: impact at hit.center + offset with the paddle normal tilted
  # by tilt_deg (about world x then y) and the paddle centre moving along the normal at `speed`.
  strokes:
    - {name: vertical 1.0 m/s,       offset: [0.0, 0.0, 0.0],    tilt_deg: [0.0, 0.0],    speed: 1.0}   # [plan Phase 4]
    - {name: tilted 15 deg 0.6 m/s,  offset: [-0.03, 0.03, 0.0], tilt_deg: [10.0, -11.0], speed: 0.6}  # [assumed] juggling-like
  max_pos_err: 0.002              # m   [plan Phase 4] paddle position error at impact
  max_normal_err_deg: 1.0         # deg [plan Phase 4]
  max_timing_err: 0.002           # s   [plan Phase 4] plane-crossing time vs commanded impact time

checks:
  hold_duration: 2.0             # s  [plan Phase 1]
  hold_max_drift: 0.001           # m  [plan Phase 1] paddle drift < 1 mm
  ready_pose_pos_tol: 0.001       # m  [assumed] IK must reach the ready paddle position to within 1 mm
  ready_pose_normal_tol_deg: 0.5  # deg [assumed] and the paddle normal to within 0.5 deg
  ballistic_duration: 1.0         # s  [plan Phase 2]
  ballistic_max_error: 0.001      # m  [plan Phase 2] MuJoCo vs independent RK4, < 1 mm over 1 s
  # Phase 2 initial conditions: (pos [m], lin vel [m/s], spin [rad/s, world]); chosen to stay above the floor for 1 s.
  ballistic_cases:
    - {name: vertical toss, pos: [0.41, 0.0, 1.2], vel: [0.0, 0.0, 4.5], spin: [0.0, 0.0, 0.0]}
    - {name: forward lob,   pos: [0.0, 0.0, 1.2],  vel: [3.0, 1.0, 4.5], spin: [0.0, 0.0, 0.0]}
    - {name: sidespin lob,  pos: [0.0, 0.0, 1.2],  vel: [2.0, 0.0, 4.5], spin: [0.0, 30.0, 120.0]}
  # Magnus coefficient used ONLY to exercise the Magnus term + spin-frame handling in the validation
  # (core config has spin off).  [assumed] order-of-magnitude test value, not a literature fit.
  ballistic_test_magnus_coefficient: 0.6
  # Phase 3 contact tests
  drop_height: 0.30               # m  [plan Phase 3] fall height of the ball centre to first contact
  drop_duration: 1.5              # s  [assumed] long enough for several bounces, short of the Zeno point
  drop_ratio_tol: 0.02            # [plan Phase 3] paddle rebound ratio vs e^2, relative
  table_rebound_tol: 0.02         # [assumed] table rebound vs the ITTF 0.23 m, relative
  impact_velocity_tol: 0.01       # [plan Phase 3] outgoing velocity vs Section 6 formula, relative
  impact_check_delay: 0.1         # s  [assumed] compare MuJoCo vs an RK4 flight of the formula's v_out this long after impact
  impact_step_phase: 0.37         # [assumed] impact placed 0.37 dt after a physics step, so detection sees real penetration
  event_time_tol: 0.002           # s  [assumed] bounce times vs analytic (event-count test)
  # Prescribed (mocap) paddle cases. tilt_deg = rotation about world x then y; paddle_vel in m/s.
  # A case with v_out_des uses the Section 6 inverse law to pick the tilt and speed instead.
  prescribed_paddle_pos: [0.40, 0.45, 1.00]   # m [assumed] beside the arm's paddle, clear of the arm
  prescribed_paddle_cases:
    - {name: moving up 0.5 m/s,   drop_height: 0.40, tilt_deg: [0.0, 0.0],   paddle_vel: [0.0, 0.0, 0.5]}
    - {name: moving up 1.0 m/s,   drop_height: 0.40, tilt_deg: [0.0, 0.0],   paddle_vel: [0.0, 0.0, 1.0]}
    - {name: tilted 15 deg,       drop_height: 0.40, tilt_deg: [15.0, 0.0],  paddle_vel: [0.0, 0.0, 0.0]}
    - {name: tilted + moving,     drop_height: 0.40, tilt_deg: [10.0, -20.0], paddle_vel: [0.2, -0.1, 0.6]}
    - {name: juggle-law inverse,  drop_height: 0.40, v_out_des: [0.15, -0.10, 2.80]}

render:
  width: 960                      # px
  height: 720                     # px
  fps: 60                         # [plan §0.7] 30–60 fps
  # Free camera framing the paddle and the ball apex (~0.6 m above the paddle).
  lookat: [0.38, 0.0, 1.15]       # m
  distance: 1.4                   # m
  azimuth: 135.0                  # deg
  elevation: -10.0                # deg
